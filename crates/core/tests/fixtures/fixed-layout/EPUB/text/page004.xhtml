<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=800, height=1200"/>
  <title>Page 4</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 800px;
      height: 1200px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      font-family: sans-serif;

    .content {
      text-align: center;
    }
    h1 {
      font-size: 72px;
      margin: 0 0 20px 0;

      font-size: 24px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>Page 4</h1>
    <p>Another fixed-layout page</p>
    <p>Same 800 × 1200 dimensions</p>
  </div>

</html>
